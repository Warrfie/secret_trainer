<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Супер секретно!</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Тема применяется до отрисовки, чтобы страница не мигала
    try {
      const theme = localStorage.getItem("secret_trainer.theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <button type="button" class="theme-btn" id="theme" aria-label="Переключить тему" title="Переключить тему">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <main id="app"><noscript>Для работы тренажёра нужен JavaScript.</noscript></main>
  <script type="importmap">
    { "imports": { "combidata": "https://cdn.jsdelivr.net/npm/combidata@0.1.0/dist/index.js" } }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
